name: Heart Disease MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-train-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linting
        run: |
          python -m ruff check src tests

      - name: Run automated tests
        run: |
          python -m pytest tests -v

      - name: Train and evaluate models
        run: |
          python -m src.heart_ml.train

      - name: Build Docker image
        run: |
          docker build -t heart-disease-api:ci .

      - name: Upload training and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-ci-artifacts
          if-no-files-found: warn
          path: |
            reports/model_results.json
            reports/figures/*.png
            artifacts/heart_disease_model.joblib
            .pytest_cache/
